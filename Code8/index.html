<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparación de Lenguajes por Modelo - Módulo Elegante</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        zinc: {
                            850: '#151518',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #09090b;
            color: #e4e4e7;
            min-height: 100vh;
        }

        /* Cursor minimalista tipo máquina de escribir */
        .typing-cursor::after {
            content: '';
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #38bdf8;
            margin-left: 3px;
            vertical-align: middle;
            animation: pulse-cursor 0.9s infinite;
        }

        @keyframes pulse-cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .code-container {
            background-color: #121215;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .code-container:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Syntax coloring */
        .syn-keyword { color: #f43f5e; font-weight: 600; }    
        .syn-prop { color: #f472b6; }                          
        .syn-func { color: #c084fc; font-weight: 600; }        
        .syn-key { color: #60a5fa; font-weight: 500; }         
        .syn-string { color: #34d399; }                      
        .syn-number { color: #f97316; font-weight: 600; }     
        .syn-operator { color: #38bdf8; font-weight: 600; }   
        .syn-bracket { color: #94a3b8; }                     
        .syn-plain { color: #cbd5e1; }

        /* Scrollbar suave */
        ::-webkit-scrollbar {
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121215;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 3px;
        }
    </style>
</head>
<body class="flex flex-col justify-center items-center p-4 sm:p-10">

    <!-- Card Contenedora -->
    <div class="max-w-3xl w-full bg-zinc-900/60 border border-zinc-800/80 rounded-2xl shadow-2xl p-6 sm:p-10 my-auto relative">
        
        <!-- Barra de Instrucciones Superior -->
        <div class="mb-8 bg-zinc-950/70 border border-zinc-800/90 rounded-xl p-4 flex items-start gap-3 text-xs text-zinc-300 shadow-sm">
            <i class="fa-solid fa-circle-info text-sky-400 text-sm mt-0.5 shrink-0"></i>
            <div class="space-y-1">
                <p>Haga clic sobre el desplegable para cambiar la velocidad de escritura. Utilice el botón de reinicio ( ↺ ) para volver a reproducir la animación.</p>
            </div>
        </div>

        <!-- Header minimalista -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 pb-6 border-b border-zinc-800/80 gap-4">
            <div>
                <p class="text-sm sm:text-base text-zinc-200 font-normal">
                    Comparación de consultas por modelo de datos.
                </p>
            </div>

            <!-- Controles integrados sin solapamiento -->
            <div class="flex items-end gap-3 self-end sm:self-auto">
                <div class="flex flex-col">
                    <label for="speedSelect" class="text-[10px] font-medium text-sky-400 mb-1 flex items-center gap-1 uppercase tracking-wider">
                        <i class="fa-solid fa-gauge-high text-[9px]"></i> Velocidad de escritura
                    </label>
                    <div class="flex items-center bg-zinc-950/90 px-3 py-2 rounded-xl border border-zinc-800 text-xs">
                        <select id="speedSelect" class="bg-transparent text-zinc-200 focus:outline-none cursor-pointer font-medium text-xs">
                            <option value="50" class="bg-zinc-900">Lenta</option>
                            <option value="25" selected class="bg-zinc-900">Normal</option>
                            <option value="8" class="bg-zinc-900">Rápida</option>
                        </select>
                    </div>
                </div>

                <button id="btnReplay" onclick="startTypingProcess()" title="Reiniciar animación" class="flex items-center justify-center w-10 h-9 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl border border-zinc-700/50 transition-all duration-150 active:scale-95 shadow-sm">
                    <i class="fa-solid fa-arrow-rotate-right text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Secciones de Código -->
        <div class="space-y-6">

            <!-- 1. SQL -->
            <div class="space-y-2">
                <h2 class="text-xs font-semibold text-zinc-400 tracking-wider uppercase px-0.5">SQL</h2>
                <div class="code-container rounded-xl px-5 py-4 font-mono text-xs sm:text-sm overflow-x-auto min-h-[110px] flex items-center">
                    <code id="code-0" class="w-full text-zinc-300 whitespace-pre"></code>
                </div>
            </div>

            <!-- 2. MongoDB -->
            <div class="space-y-2">
                <h2 class="text-xs font-semibold text-zinc-400 tracking-wider uppercase px-0.5">MongoDB</h2>
                <div class="code-container rounded-xl px-5 py-4 font-mono text-xs sm:text-sm overflow-x-auto min-h-[70px] flex items-center">
                    <code id="code-1" class="w-full text-zinc-300 whitespace-pre"></code>
                </div>
            </div>

            <!-- 3. Redis -->
            <div class="space-y-2">
                <h2 class="text-xs font-semibold text-zinc-400 tracking-wider uppercase px-0.5">Redis</h2>
                <div class="code-container rounded-xl px-5 py-4 font-mono text-xs sm:text-sm overflow-x-auto min-h-[70px] flex items-center">
                    <code id="code-2" class="w-full text-zinc-300 whitespace-pre"></code>
                </div>
            </div>

        </div>

        <!-- Pie descriptivo -->
        <p class="text-xs sm:text-sm text-zinc-400 font-light mt-8 pt-4 border-t border-zinc-800/50">
            Cada lenguaje responde al modelo de almacenamiento utilizado.
        </p>

    </div>

    <script>
        // Tokens para SQL, MongoDB y Redis
        const snippetSQL = [
            { text: "SELECT", class: "syn-keyword" },
            { text: " nombre\n", class: "syn-plain" },
            { text: "FROM", class: "syn-keyword" },
            { text: " clientes\n", class: "syn-plain" },
            { text: "WHERE", class: "syn-keyword" },
            { text: " ciudad", class: "syn-plain" },
            { text: "=", class: "syn-operator" },
            { text: "'Bogotá'", class: "syn-string" },
            { text: ";", class: "syn-plain" }
        ];

        const snippetMongo = [
            { text: "db", class: "syn-prop" },
            { text: ".", class: "syn-plain" },
            { text: "clientes", class: "syn-prop" },
            { text: ".", class: "syn-plain" },
            { text: "find", class: "syn-func" },
            { text: "({", class: "syn-bracket" },
            { text: "ciudad", class: "syn-key" },
            { text: ':"', class: "syn-plain" },
            { text: "Bogotá", class: "syn-string" },
            { text: '"},{', class: "syn-bracket" },
            { text: "nombre", class: "syn-key" },
            { text: ":", class: "syn-plain" },
            { text: "1", class: "syn-number" },
            { text: "})", class: "syn-bracket" }
        ];

        const snippetRedis = [
            { text: "GET", class: "syn-keyword" },
            { text: " cliente", class: "syn-plain" },
            { text: ":", class: "syn-operator" },
            { text: "1001", class: "syn-number" }
        ];

        let currentSpeed = 25;
        let animationTimeouts = [];

        const block0 = document.getElementById("code-0");
        const block1 = document.getElementById("code-1");
        const block2 = document.getElementById("code-2");
        const speedSelect = document.getElementById("speedSelect");

        function clearTimeouts() {
            animationTimeouts.forEach(t => clearTimeout(t));
            animationTimeouts = [];
        }

        function typeSnippet(container, tokens) {
            return new Promise((resolve) => {
                container.innerHTML = "";
                let tokenIndex = 0;
                let charIndex = 0;

                container.classList.add("typing-cursor");

                let currentSpan = null;

                function step() {
                    if (tokenIndex >= tokens.length) {
                        container.classList.remove("typing-cursor");
                        resolve();
                        return;
                    }

                    const token = tokens[tokenIndex];

                    if (charIndex === 0) {
                        currentSpan = document.createElement("span");
                        if (token.class) currentSpan.className = token.class;
                        container.appendChild(currentSpan);
                    }

                    currentSpan.textContent += token.text[charIndex];
                    charIndex++;

                    if (charIndex >= token.text.length) {
                        tokenIndex++;
                        charIndex = 0;
                    }

                    const timeout = setTimeout(step, currentSpeed);
                    animationTimeouts.push(timeout);
                }

                step();
            });
        }

        async function startTypingProcess() {
            clearTimeouts();
            block0.innerHTML = "";
            block1.innerHTML = "";
            block2.innerHTML = "";

            await typeSnippet(block0, snippetSQL);
            await new Promise(r => setTimeout(r, 200));
            await typeSnippet(block1, snippetMongo);
            await new Promise(r => setTimeout(r, 200));
            await typeSnippet(block2, snippetRedis);
        }

        speedSelect.addEventListener("change", (e) => {
            currentSpeed = parseInt(e.target.value, 10) || 25;
        });

        // Iniciar animación
        startTypingProcess();
    </script>
</body>
</html>
