<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Interactivo NoSQL - Typing Animation</title>
  
  <!-- Tipografías: Poppins para la UI y JetBrains Mono para los bloques de código -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-main: #0d0f12;
      --card-bg: #14171d;
      --code-bg: #090a0d;
      --border-color: #232832;
      --border-highlight: #343c4c;
      --text-main: #e2e8f0;
      --text-muted: #8b949e;
      
      /* Sintaxis de colorización */
      --syn-key: #60a5fa;        /* Azul clave JSON */
      --syn-string: #34d399;     /* Verde string */
      --syn-func: #fbbf24;       /* Amarillo función */
      --syn-bracket: #94a3b8;    /* Gris corchetes/llaves */
      --syn-prop: #f472b6;       /* Rosa propiedad de objeto */
      --syn-plain: #cbd5e1;      /* Blanco roto texto plano */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* Barra de instrucciones superior */
    .instruction-banner {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.85rem 1.25rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .instruction-banner strong {
      color: var(--text-main);
      font-weight: 500;
    }

    /* Panel superior de controles */
    .controls-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .control-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .select-style {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.85rem;
      border-radius: 6px;
      font-family: 'Poppins', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .select-style:hover, .select-style:focus {
      border-color: var(--border-highlight);
    }

    .btn-icon {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.1rem;
    }

    .btn-icon:hover {
      border-color: var(--border-highlight);
      background-color: #1a1e27;
    }

    /* Bloques de código */
    .code-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .code-header {
      background-color: rgba(255, 255, 255, 0.02);
      padding: 0.75rem 1.25rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    .code-body {
      background-color: var(--code-bg);
      padding: 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      white-space: pre;
      overflow-x: auto;
      min-height: 60px;
    }

    /* Resaltado de Sintaxis */
    .syn-key { color: var(--syn-key); font-weight: 500; }
    .syn-string { color: var(--syn-string); }
    .syn-func { color: var(--syn-func); font-weight: 600; }
    .syn-bracket { color: var(--syn-bracket); }
    .syn-prop { color: var(--syn-prop); }
    .syn-plain { color: var(--syn-plain); }

    /* Cursor de máquina de escribir */
    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.1em;
      background-color: #60a5fa;
      vertical-align: middle;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .section-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-main);
      margin-top: 0.5rem;
    }

    .section-description {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: -0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Instrucciones -->
    <div class="instruction-banner">
      <span>Haga clic sobre el desplegable para cambiar la velocidad de escritura. Utilice el botón de reinicio ( ↺ ) para volver a reproducir la animación.</span>
    </div>

    <!-- Panel de Control -->
    <div class="controls-header">
      <div></div>
      <div class="controls-group">
        <div class="input-group">
          <label class="control-label" for="speedSelect">Velocidad de escritura</label>
          <select id="speedSelect" class="select-style">
            <option value="slow">Lenta</option>
            <option value="normal" selected>Normal</option>
            <option value="fast">Rápida</option>
          </select>
        </div>
        <button id="restartBtn" class="btn-icon" title="Reiniciar animación">↺</button>
      </div>
    </div>

    <!-- Bloque 1: Documento JSON -->
    <div class="code-card">
      <div class="code-header">Documento de Ejemplo</div>
      <div class="code-body" id="codeBlock1"></div>
    </div>

    <div class="section-title">Consulta</div>

    <!-- Bloque 2: Consulta MongoDB -->
    <div class="code-card">
      <div class="code-header">MongoDB Query</div>
      <div class="code-body" id="codeBlock2"></div>
    </div>

    <div class="section-description">Esto accede directamente al subcampo interno.</div>

  </div>

  <script>
    // Definición de tokens para formateo y animación
    const snippet1 = [
      { text: "{\n", class: "syn-bracket" },
      { text: '  "cliente"', class: "syn-key" },
      { text: ": ", class: "syn-plain" },
      { text: '"Ana"', class: "syn-string" },
      { text: ",\n", class: "syn-plain" },
      { text: '  "direccion"', class: "syn-key" },
      { text: ": {\n", class: "syn-bracket" },
      { text: '    "ciudad"', class: "syn-key" },
      { text: ": ", class: "syn-plain" },
      { text: '"Bogotá"', class: "syn-string" },
      { text: ",\n", class: "syn-plain" },
      { text: '    "pais"', class: "syn-key" },
      { text: ": ", class: "syn-plain" },
      { text: '"Colombia"', class: "syn-string" },
      { text: "\n  }\n}", class: "syn-bracket" }
    ];

    const snippet2 = [
      { text: "db", class: "syn-prop" },
      { text: ".", class: "syn-plain" },
      { text: "clientes", class: "syn-prop" },
      { text: ".", class: "syn-plain" },
      { text: "find", class: "syn-func" },
      { text: "({", class: "syn-bracket" },
      { text: '"direccion.ciudad"', class: "syn-key" },
      { text: ":", class: "syn-plain" },
      { text: '"Bogotá"', class: "syn-string" },
      { text: "})", class: "syn-bracket" }
    ];

    const speeds = {
      slow: 45,
      normal: 25,
      fast: 8
    };

    let currentSpeed = speeds.normal;
    let isTyping = false;
    let animationTimeout = null;

    const block1 = document.getElementById("codeBlock1");
    const block2 = document.getElementById("codeBlock2");
    const speedSelect = document.getElementById("speedSelect");
    const restartBtn = document.getElementById("restartBtn");

    function clearBlocks() {
      if (animationTimeout) clearTimeout(animationTimeout);
      block1.innerHTML = "";
      block2.innerHTML = "";
    }

    async function startTypingProcess() {
      clearBlocks();
      isTyping = true;

      await typeSnippet(block1, snippet1);
      await new Promise(r => setTimeout(r, 200));
      await typeSnippet(block2, snippet2);

      isTyping = false;
    }

    function typeSnippet(container, tokens) {
      return new Promise((resolve) => {
        let tokenIndex = 0;
        let charIndex = 0;

        const cursor = document.createElement("span");
        cursor.className = "cursor";
        container.appendChild(cursor);

        let currentSpan = null;

        function step() {
          if (tokenIndex >= tokens.length) {
            cursor.remove();
            resolve();
            return;
          }

          const token = tokens[tokenIndex];

          if (charIndex === 0) {
            currentSpan = document.createElement("span");
            if (token.class) currentSpan.className = token.class;
            container.insertBefore(currentSpan, cursor);
          }

          currentSpan.textContent += token.text[charIndex];
          charIndex++;

          if (charIndex >= token.text.length) {
            tokenIndex++;
            charIndex = 0;
          }

          animationTimeout = setTimeout(step, currentSpeed);
        }

        step();
      });
    }

    speedSelect.addEventListener("change", (e) => {
      currentSpeed = speeds[e.target.value] || speeds.normal;
    });

    restartBtn.addEventListener("click", () => {
      startTypingProcess();
    });

    // Iniciar al cargar
    startTypingProcess();
  </script>
</body>
</html>
